name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CODERISK_API_KEY: dev-key-change-in-production
  REDIS_URL: redis://redis:6379/0
  CODERISK_PATH: /app/code-risk-agent
  REPORTS_DIR: /app/reports
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ───────────────────────────────────────────────
  # Job 1: 单元测试 + 引擎测试
  # ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    name: Test (pytest + engine)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Cloud layer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Cloud layer tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short

      - name: Install Engine dependencies
        run: |
          cd code-risk-agent
          pip install -e . || true
          pip install pytest

      - name: Run Engine unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/code-risk-agent
        run: |
          cd code-risk-agent
          pytest tests/ -v --tb=short || true

      - name: Generate coverage report
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ --cov=app --cov-report=xml --cov-report=term || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # ───────────────────────────────────────────────
  # Job 2: Docker Compose 端到端验证 + 构建镜像
  # ───────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    name: E2E (docker compose + verify.sh)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build images with cache
        run: |
          docker compose build             --build-arg BUILDKIT_INLINE_CACHE=1

      - name: Start services
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          for i in $(seq 1 30); do
            echo "Attempt $i/30..."
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is healthy!"
              break
            fi
            sleep 3
          done

      - name: Check container status
        run: docker compose ps

      - name: Test /health endpoint
        run: |
          curl -sf http://localhost:8000/health | python -m json.tool

      - name: Test /demo endpoint
        run: |
          curl -sf http://localhost:8000/demo | python -m json.tool

      - name: Run verify.sh
        env:
          CODERISK_API_URL: http://localhost:8000
        run: |
          bash verify.sh || true

      - name: Test GitHub analysis submission
        run: |
          curl -X POST http://localhost:8000/api/v1/analyze             -H "Authorization: Bearer dev-key-change-in-production"             -H "Content-Type: application/json"             -d '{"source": "github", "repo_url": "https://github.com/a9320/coderisk-cloud", "output_formats": ["json"]}'             | python -m json.tool

      - name: Export image for security scan
        run: |
          docker save coderisk-cloud-api:latest -o /tmp/coderisk-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderisk-image
          path: /tmp/coderisk-image.tar
          retention-days: 1

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  # ───────────────────────────────────────────────
  # Job 3: 安全扫描（复用 e2e 构建的镜像）
  # ───────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    name: Security (pip-audit + Trivy)
    needs: [e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          echo "=== Dependency Vulnerability Scan ==="
          pip-audit --desc || true

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: coderisk-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/coderisk-image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'coderisk-cloud-api:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Display Trivy summary
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'coderisk-cloud-api:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
