# CodeRisk Cloud — Docker Compose GPU Overlay (AMD ROCm)
# 使用方式：
#   docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# 前置条件：
#   1. 宿主机已安装 ROCm 驱动（rocm-smi 可正常运行）
#   2. 用户已在 video 组（或 root）
#   3. /dev/kfd 和 /dev/dri 设备存在

services:
  worker:
    # 覆盖 worker 为 GPU 模式
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      # ROCm 环境变量（根据 GPU 型号调整）
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-}
      - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-0}
      # 本地 llama.cpp GPU 模式（如果 CodeRisk Agent 配置为 local_llama_cpp）
      - GGML_HIP=ON
    # 可选：限制 GPU 资源
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: amdgpu
    #           count: 1
    #           capabilities: [gpu]
