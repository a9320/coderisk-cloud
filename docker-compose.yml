services:
  redis:
    image: redis:7-alpine
    container_name: coderisk-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: coderisk-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CODERISK_API_KEY=dev-key-change-in-production
      - CODERISK_PATH=/app/code-risk-agent
      - NUTRIENT_DWS_API_KEY=${NUTRIENT_DWS_API_KEY:-}
      - REPORTS_DIR=/app/reports
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - LOCAL_HTTP_URL=http://host.docker.internal:8080
    volumes:
      - ./reports:/app/reports
      - ./repos:/repos:ro
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: coderisk-worker
    command: celery -A app.tasks worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CODERISK_API_KEY=dev-key-change-in-production
      - CODERISK_PATH=/app/code-risk-agent
      - PYTHONPATH=/app/code-risk-agent
      - NUTRIENT_DWS_API_KEY=${NUTRIENT_DWS_API_KEY:-}
      - REPORTS_DIR=/app/reports
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - LOCAL_HTTP_URL=http://host.docker.internal:8080
    volumes:
      - ./reports:/app/reports
      - ./repos:/repos:ro
    depends_on:
      - redis
      - api

  dashboard:
    build: .
    container_name: coderisk-dashboard
    command: streamlit run app/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./repos:/repos:ro
    depends_on:
      - api
